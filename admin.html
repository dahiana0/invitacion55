<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Confirmaciones · Administración</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #1f1c1a;
            --ink-soft: #4a4540;
            --ivory: #fbf8f2;
            --linen: #8aa3b8;
            --gold: #a68b5b;
            --error: #9b3a34;
            --font-title: "Playfair Display", "Times New Roman", serif;
            --font-text: "Cormorant Garamond", Georgia, serif;
        }

        body {
            min-height: 100vh;
            padding: 24px 16px 60px;
            background: var(--linen);
            color: var(--ink);
            font-family: var(--font-text);
            font-size: 18px;
            -webkit-font-smoothing: antialiased;
        }

        button, input { font: inherit; color: inherit; }

        .panel {
            width: min(100%, 980px);
            margin: 0 auto;
            padding: clamp(24px, 5vw, 48px);
            background: var(--ivory);
            box-shadow: 0 24px 44px rgba(15, 25, 35, 0.28);
        }

        h1 {
            font-family: var(--font-title);
            font-weight: 400;
            font-size: clamp(1.5rem, 5vw, 2.1rem);
            letter-spacing: 0.12em;
            text-align: center;
        }

        .btn {
            display: inline-block;
            min-height: 46px;
            padding: 12px 28px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--ivory);
            font-family: var(--font-title);
            font-size: 0.72rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s, color 0.3s;
        }
        .btn:hover { transform: translateY(-3px); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
        .btn--ghost { background: transparent; color: var(--ink); }
        .btn--ghost:hover { background: var(--ink); color: var(--ivory); }

        :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

        /* Login */
        #loginView { max-width: 420px; margin: 0 auto; }
        #loginView p.hint { margin: 10px 0 28px; text-align: center; color: var(--ink-soft); }
        #loginForm label {
            display: block;
            margin-bottom: 16px;
            font-family: var(--font-title);
            font-size: 0.68rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }
        #loginForm input {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 12px 14px;
            min-height: 48px;
            background: #fff;
            border: 1px solid #cfc7b8;
            border-radius: 0;
            font-size: 1.1rem;
            transition: border-color 0.35s, box-shadow 0.35s;
        }
        #loginForm input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(166, 139, 91, 0.2);
        }
        #loginForm .btn { width: 100%; margin-top: 8px; }
        .msg { min-height: 1.4em; margin-top: 12px; text-align: center; color: var(--error); }

        /* Panel */
        #dashView[hidden], #loginView[hidden] { display: none; }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 32px 0 28px;
        }
        .stat {
            padding: 20px 12px;
            text-align: center;
            border: 1px solid rgba(166, 139, 91, 0.6);
        }
        .stat span {
            display: block;
            font-family: var(--font-title);
            font-size: 0.64rem;
            letter-spacing: 0.22em;
            color: var(--ink-soft);
        }
        .stat strong {
            display: block;
            margin-top: 6px;
            font-family: var(--font-title);
            font-weight: 400;
            font-size: clamp(2.2rem, 9vw, 3.4rem);
            line-height: 1.1;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .toolbar .updated { color: var(--ink-soft); font-style: italic; }
        .toolbar .actions { display: flex; gap: 10px; }

        .table-wrap { overflow-x: auto; border-top: 1px solid rgba(166, 139, 91, 0.6); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 10px; text-align: left; border-bottom: 1px solid #e3dccd; }
        th {
            font-family: var(--font-title);
            font-weight: 400;
            font-size: 0.66rem;
            letter-spacing: 0.2em;
            color: var(--ink-soft);
        }
        td.num, th.num { text-align: center; }
        td.empty { padding: 36px 10px; text-align: center; color: var(--ink-soft); font-style: italic; }

        /* ===== RESPONSIVE: en celular cada confirmación se vuelve una tarjeta ===== */
        @media (max-width: 680px) {
            body { padding: 12px 10px 40px; font-size: 17px; }
            .panel { padding: 22px 16px; }
            .stats { gap: 10px; margin: 24px 0 20px; }
            .stat { padding: 16px 6px; }
            .toolbar { flex-direction: column; align-items: stretch; text-align: center; }
            .toolbar .actions { flex-direction: column; }
            .toolbar .actions .btn { width: 100%; }
            .table-wrap { overflow-x: visible; border-top: 0; }
            table, tbody, tr, td { display: block; width: 100%; }
            thead { display: none; }
            tr {
                margin-bottom: 14px;
                padding: 12px 14px;
                border: 1px solid rgba(166, 139, 91, 0.6);
                background: #fff;
            }
            td, td.num, td.empty {
                display: flex;
                justify-content: space-between;
                gap: 14px;
                padding: 6px 0;
                text-align: right;
                border-bottom: 1px dashed #e3dccd;
                overflow-wrap: anywhere;
            }
            td:last-child { border-bottom: 0; }
            td::before {
                content: attr(data-label);
                flex: none;
                font-family: var(--font-title);
                font-size: 0.6rem;
                letter-spacing: 0.18em;
                color: var(--ink-soft);
                align-self: center;
            }
            td.empty { display: block; text-align: center; }
            td.empty::before { content: none; }
        }
    </style>
</head>
<body>

    <div class="panel">

        <!-- ================= LOGIN ================= -->
        <section id="loginView">
            <h1>ADMINISTRACIÓN</h1>
            <p class="hint">Ingresa con el usuario administrador creado en Supabase.</p>

            <form id="loginForm">
                <label>
                    EMAIL
                    <input type="email" id="loginEmail" autocomplete="username" required>
                </label>
                <label>
                    CONTRASEÑA
                    <input type="password" id="loginPassword" autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn" id="loginBtn">ENTRAR</button>
                <p class="msg" id="loginMsg" role="alert"></p>
            </form>
        </section>

        <!-- ================= PANEL ================= -->
        <section id="dashView" hidden>

            <h1>CONFIRMACIONES</h1>

            <div class="stats">
                <div class="stat">
                    <span>TOTAL DE PERSONAS</span>
                    <strong id="totalPersonas">0</strong>
                </div>
                <div class="stat">
                    <span>TOTAL DE RESERVAS</span>
                    <strong id="totalReservas">0</strong>
                </div>
            </div>

            <div class="toolbar">
                <p class="updated" id="updatedAt"></p>
                <div class="actions">
                    <button class="btn" id="refreshBtn" type="button">ACTUALIZAR</button>
                    <button class="btn btn--ghost" id="logoutBtn" type="button">SALIR</button>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>NOMBRE</th>
                            <th class="num">PERSONAS</th>
                            <th>TELÉFONO</th>
                            <th>EMAIL</th>
                            <th>FECHA</th>
                        </tr>
                    </thead>
                    <tbody id="guestRows">
                        <!-- Ejemplo de fila: Carlos Pérez | 3 | 3000000000 | correo@email.com | 25/10/2026 -->
                    </tbody>
                </table>
            </div>

            <p class="msg" id="dashMsg" role="alert"></p>

        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
